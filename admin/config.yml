backend:
  name: github
  repo: sahraandbeyond/sahra-beyond
  branch: main
  base_url: https://sahra-beyond-qo5i.vercel.app
  auth_endpoint: api/auth

media_folder: "uploads"
public_folder: "/uploads"

site_url: https://www.sahraandbeyond.ae

collections:

  - name: "products"
    label: "Products (Tees)"
    label_singular: "Product"
    folder: "content/products"
    create: true
    format: json
    slug: "{{id}}"
    identifier_field: name
    summary: "{{drop}} — {{name}}"
    description: "Each entry generates its own product page at /products/<id>/. Regular and Oversized are SEPARATE products sharing a design — link them with 'Same design, other fit'. Size measurements are NOT here: they live once in content/sizing.json and drive every table on the site. The photos here are used on the product page and as the share image. Note: the SHOP page pulls its product photos from Shopify, not from here."
    fields:
      - { label: "URL slug (id)", name: "id", widget: "string", hint: "Lowercase, dashes only — becomes /products/<id>/. Don't change after launch or the link breaks." }
      - { label: "Product name", name: "name", widget: "string" }
      - { label: "Name with styling", name: "nameHtml", widget: "string", hint: "Same name, but wrap ONE word in <em>…</em> to italicise it in the big heading. e.g. Al Quaa <em>Galaxy</em> Tee" }
      - { label: "SKU", name: "sku", widget: "string", required: false }
      - { label: "Drop label", name: "drop", widget: "string", default: "Drop 01", hint: "Badge shown on the photo." }
      - { label: "Sort order", name: "order", widget: "number", default: 1, value_type: "int", hint: "1 shows first." }
      - { label: "Price (AED)", name: "price", widget: "string", default: "149" }
      - { label: "Shop anchor", name: "shopAnchor", widget: "string", hint: "Place slug of this product's section on the shop page, so 'Shop this tee' jumps to the right one. e.g. al-quaa-desert" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["regular-tees", "oversized-tees", "polos"]
        default: "regular-tees"
        hint: "Drives which category page this appears on: /t-shirts/regular/, /t-shirts/oversized/ or /polos/."
      - label: "Fit"
        name: "fit"
        widget: "select"
        options: ["regular", "oversized", ""]
        default: "regular"
        required: false
        hint: "Decides WHICH size table this page shows. Leave blank for the polo (it has no tee chart)."
      - { label: "Garment type", name: "garment", widget: "string", default: "tee", required: false, hint: "tee or polo. Used in button copy." }
      - { label: "Same design, other fit", name: "siblingOf", widget: "string", required: false, hint: "Shared stem for the two fits of one design, e.g. al-quaa-galaxy. Links the pages to each other. Blank for the polo." }
      - { label: "Edition line", name: "edition", widget: "string", required: false, hint: "e.g. Founding Edition — a limited first run. Never publish piece counts or numbering." }
      - { label: "Fit — section heading", name: "fitHeading", widget: "string", required: false, hint: "<em>…</em> allowed. e.g. True to size, <em>built to layer</em>" }
      - { label: "Fit — who it is for", name: "fitWho", widget: "text", required: false, hint: "The fit-specific paragraph. Keep the two fits genuinely different — near-identical pages get treated as duplicate content." }
      - { label: "Tee size chart applies?", name: "sizingApplies", widget: "boolean", default: true, required: false, hint: "OFF for the polo — it is cut narrower with a set-in sleeve, so the tee chart does not apply." }
      - { label: "Eyebrow (products with no place)", name: "eyebrow", widget: "string", required: false, hint: "Shown above the title when the product is not tied to a location, e.g. the polo." }

      - { label: "PHOTO — Main (flat lay / share image)", name: "imgMain", widget: "image", hint: "Also used as the WhatsApp/Instagram preview image." }
      - { label: "PHOTO — Front", name: "imgFront", widget: "image" }
      - { label: "PHOTO — Back", name: "imgBack", widget: "image" }
      - { label: "Alt text — main photo", name: "altMain", widget: "string", hint: "Describe the photo for screen readers and Google." }
      - { label: "Alt text — front", name: "altFront", widget: "string" }
      - { label: "Alt text — back", name: "altBack", widget: "string" }
      - label: "Model / worn photos"
        name: "modelShots"
        widget: "list"
        required: false
        hint: "Real photos of the tee being worn. They join the product gallery after the front/back shots. Never a photo that reveals the founder."
        fields:
          - { label: "Image", name: "src", widget: "image" }
          - { label: "Alt text", name: "alt", widget: "string", hint: "Describe what the photo shows for screen readers and Google." }

      - { label: "Theme colour", name: "theme", widget: "color", default: "#181109", hint: "MUST match this product's section colour on the shop page. Al Quaa #181109 · Liwa #E7D6B8 · Hajar #C6BFD3" }
      - { label: "Second colour (scroll fades to this)", name: "theme2", widget: "color", default: "#1B1430" }
      - { label: "Accent colour", name: "accent", widget: "color", default: "#E9B978", hint: "Hover states. Gold on dark products, clay (#9C521B) on light ones." }
      - label: "Background animation"
        name: "scene"
        widget: "select"
        default: "galaxy"
        options: ["galaxy", "dunes", "mountains"]
        hint: "The living backdrop: starfield, drifting dunes, or mountain ridges."

      - { label: "Short intro (under the price)", name: "lede", widget: "text", hint: "One or two sentences. Basic HTML like <em> is allowed." }
      - label: "Spec chips (under the price)"
        name: "specChips"
        widget: "list"
        required: false
        field: { label: "Chip", name: "chip", widget: "string" }
        hint: "Tees: 230gsm organic cotton / Ribbed crew neck / Taped collar &amp; shoulder seams. Polo differs — 240gsm, ribbed collar & placket, taped shoulder seams. 'Unisex · S–XL' is added automatically."
      - { label: "Print/finish chip", name: "printChip", widget: "string", default: "DTG print · soft &amp; breathable", hint: "Small pill beside the fabric specs." }
      - { label: "Made for… (occasion)", name: "occasion", widget: "string", hint: "Where you'd actually wear it." }

      - { label: "Place — name", name: "placeName", widget: "string" }
      - { label: "Place — emirate", name: "placeEmirate", widget: "string" }
      - { label: "Place — location page slug", name: "placeSlug", widget: "string", hint: "Links to /locations/<slug>/ — must match an existing Location entry." }
      - { label: "Place — latitude", name: "lat", widget: "number", value_type: "float", step: 0.00001 }
      - { label: "Place — longitude", name: "lng", widget: "number", value_type: "float", step: 0.00001 }
      - { label: "Place — Bortle label", name: "bortleLabel", widget: "string", default: "Bortle 1" }
      - { label: "Place — Bortle number (1–9)", name: "bortleLit", widget: "number", value_type: "int", default: 1, min: 1, max: 9, hint: "How many pips light up on the darkness scale." }
      - { label: "Place — sky line", name: "skyLine", widget: "string", hint: "e.g. Bortle 1 · darkest sky in the Emirates" }
      - { label: "Place — heading", name: "placeHeading", widget: "string", hint: "<em>…</em> allowed for the italic word." }
      - { label: "Place — blurb", name: "placeBlurb", widget: "text" }
      - { label: "Place — Bortle explainer", name: "bortleCopy", widget: "text" }

      - { label: "Design — heading", name: "designHeading", widget: "string", hint: "<em>…</em> allowed." }
      - { label: "Design — intro", name: "designIntro", widget: "text" }
      - label: "Design — three points"
        name: "designCards"
        widget: "list"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Text", name: "body", widget: "text", hint: "Basic HTML allowed." }
      - { label: "Construction — intro", name: "constructionIntro", widget: "text", required: false, hint: "Section 03 opener. Defaults to the tee wording; the polo overrides it." }
      - label: "Construction — three cards"
        name: "constructionCards"
        widget: "list"
        required: false
        hint: "Leave empty to use the tee defaults (230gsm / ribbed crew neck / taped collar & shoulders). The polo overrides all three."
        fields:
          - { label: "Title", name: "t", widget: "string" }
          - { label: "Body", name: "b", widget: "text" }
      - { label: "Fits card — title", name: "fitsCardTitle", widget: "string", required: false, hint: "Default: Unisex, two fits" }
      - { label: "Fits card — body", name: "fitsCardBody", widget: "text", required: false }
      - { label: "Print method — card title", name: "printCardTitle", widget: "string", default: "DTG print" }
      - { label: "Print method — card text", name: "printCardBody", widget: "text" }

      - { label: "Fit — extra note", name: "fitExtra", widget: "string", required: false, hint: "Optional sentence appended after the sizes line." }
      - { label: "Care — heading", name: "careHeading", widget: "string", hint: "<em>…</em> allowed." }
      - { label: "Care — intro", name: "careIntro", widget: "text" }
      - label: "Care — instructions"
        name: "care"
        widget: "list"
        field: { label: "Instruction", name: "item", widget: "string" }

      - label: "FAQ"
        name: "faq"
        widget: "list"
        hint: "Answers the real objections. Keep them honest — never promise a restock."
        fields:
          - { label: "Question", name: "q", widget: "string" }
          - { label: "Answer", name: "a", widget: "text" }

      - { label: "SEO — page title", name: "seoTitle", widget: "string", hint: "'| Sahra & Beyond' is added automatically." }
      - { label: "SEO — description", name: "seoDesc", widget: "text", hint: "Aim for under 160 characters." }
      - { label: "Share description", name: "shareDesc", widget: "text", hint: "Used on WhatsApp/Instagram/X previews." }
      - { label: "Structured-data description", name: "ldDesc", widget: "text", hint: "Plain text for Google. No HTML." }

  - name: "locations"
    label: "Locations"
    label_singular: "Location"
    folder: "content/locations"
    create: true
    format: json
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{emoji}} {{name}} — {{emirate}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Emoji Icon", name: "emoji", widget: "string", default: "📍" }
      - { label: "Emirate", name: "emirate", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Dunes", "Mountains", "Wadis", "Coast", "Camping", "Night"]
      - label: "Difficulty"
        name: "difficulty"
        widget: "select"
        options: ["Easy", "Moderate", "Hard"]
      - { label: "Best Season", name: "season", widget: "string", default: "Oct–Apr" }
      - { label: "Distance from Dubai", name: "distance", widget: "string", required: false }
      - { label: "Latitude", name: "lat", widget: "number", value_type: "float", step: 0.0001, hint: "Decimal degrees, e.g. 24.9183. Tip: right-click the exact spot in Google Maps and the FIRST number shown is the latitude." }
      - { label: "Longitude", name: "lng", widget: "number", value_type: "float", step: 0.0001, hint: "Decimal degrees, e.g. 55.5672. The SECOND number from Google Maps is the longitude." }
      - label: "Condition Status"
        name: "status"
        widget: "select"
        options:
          - { label: "Ideal", value: "safe" }
          - { label: "Warm", value: "warn" }
          - { label: "Hot / Extreme", value: "hot" }
      - { label: "Short Description", name: "desc", widget: "text", hint: "One or two sentences. Shown on cards, the map and as the page meta description." }
      - { label: "Full Description (SEO page)", name: "body", widget: "text", required: false, hint: "A few paragraphs (separate with a blank line). This is the main content of the location's own Google-indexed page. Leave blank to fall back to the short description." }
      - { label: "Cover Photo", name: "cover", widget: "image", required: false, hint: "Main photo — used as the page banner AND the preview image when the page is shared on WhatsApp/Instagram/etc. A wide landscape photo works best." }
      - label: "Cover Photo Framing"
        name: "coverFocus"
        widget: "coverfocus"
        required: false
        default: "50% 50%"
        hint: "Drag the sliders to choose which part of the cover photo shows in the card and banner. The preview updates live."
      - label: "Photo Gallery"
        name: "gallery"
        widget: "list"
        required: false
        hint: "Add as many photos as you like — they appear in a gallery on the location's page. Upload from your computer; no coding needed."
        field: { label: "Photo", name: "image", widget: "image" }
      - label: "Instagram Posts"
        name: "igPosts"
        widget: "list"
        required: false
        hint: "Paste full Instagram post/reel URLs (e.g. https://www.instagram.com/p/XXXXXXXXX/). Each one is embedded in the location's 'On the gram' section. Leave empty if none."
        field: { label: "Instagram Post URL", name: "url", widget: "string" }

  - name: "journal"
    label: "Journal"
    label_singular: "Article"
    folder: "content/journal"
    create: true
    format: json
    slug: "{{slug}}"
    identifier_field: slug
    summary: "{{date}} — {{title}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "URL slug", name: "slug", widget: "string", hint: "Lowercase, dashes only — becomes /journal/<slug>/. Don't change it after publishing or the link breaks and any ranking resets." }
      - { label: "Draft (not published)", name: "draft", widget: "boolean", default: true, required: false, hint: "ON keeps it out of the build entirely — no page, no sitemap entry. Turn OFF when it is ready to go live." }
      - { label: "Headline (on the page)", name: "h1", widget: "string", hint: "What readers see. Say the thing plainly." }
      - { label: "Title tag (Google)", name: "title", widget: "string", hint: "KEEP UNDER 60 CHARACTERS or Google truncates it. This is the blue link in search results and can differ from the headline." }
      - { label: "Meta description", name: "desc", widget: "text", hint: "Aim for 150–160 characters. This is the grey text under the blue link — write it to earn the click, not to stuff keywords." }
      - { label: "Standfirst", name: "dek", widget: "text", required: false, hint: "One sentence under the headline. Shown on the card in the Journal index too." }
      - { label: "Publish date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, hint: "Newest sorts to the top of the Journal." }
      - { label: "Last updated", name: "updated", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false, hint: "Set this when you materially revise a published piece. It feeds the sitemap and tells Google the page is maintained." }
      - { label: "Tag", name: "tag", widget: "select", options: ["Fabric", "Fit", "Craft", "Places", "Brand"], default: "Fabric", hint: "Shown as the kicker on the card." }
      - { label: "Reading time (minutes)", name: "readMins", widget: "number", value_type: "int", required: false, hint: "Optional. Roughly words divided by 220." }
      - { label: "Emoji", name: "emoji", widget: "string", default: "✍", required: false }
      - label: "Hero colour theme"
        name: "cat"
        widget: "select"
        options: ["Mountains", "Dunes", "Camping", "Wadis", "Coast"]
        default: "Mountains"
        required: false
        hint: "Only changes the gradient behind the headline."
      - { label: "Cover image", name: "cover", widget: "image", required: false, hint: "Used as the social share image. NEVER a photo showing a face — the brand stays faceless." }
      - { label: "Intro", name: "intro", widget: "text", hint: "The opening, before the first subheading. Blank line between paragraphs." }
      - label: "Sections"
        name: "sections"
        widget: "list"
        required: false
        hint: "Each one becomes an H2. Two or three long sections beat eight thin ones — one strong page ranks for dozens of long-tail phrases, while thin pages get judged at site level."
        fields:
          - { label: "Subheading (H2)", name: "h2", widget: "string" }
          - { label: "Body", name: "body", widget: "text", hint: "Blank line between paragraphs." }
      - label: "Link to a product"
        name: "productLink"
        widget: "object"
        required: false
        collapsed: true
        hint: "One contextual link in a sentence, not a banner. Leave blank if the connection would be a stretch — a forced link reads as an advert and is worth less than none."
        fields:
          - { label: "Text before the link", name: "before", widget: "string", required: false }
          - { label: "Link URL", name: "href", widget: "string", required: false, hint: "e.g. /products/al-quaa-galaxy-regular/" }
          - { label: "Link text", name: "label", widget: "string", required: false }
          - { label: "Text after the link", name: "after", widget: "string", required: false }
      - label: "FAQs"
        name: "faqs"
        widget: "list"
        required: false
        hint: "These become FAQPage schema and can win their own result in Google. Answer the question in the first sentence. Only ask questions a real customer would."
        fields:
          - { label: "Question", name: "q", widget: "string" }
          - { label: "Answer", name: "a", widget: "text" }

  - name: "settings"
    label: "Settings"
    files:
      - label: "App Settings"
        name: "general"
        file: "content/settings.json"
        fields:
          - { label: "App Name", name: "appName", widget: "string", default: "Sahra & Beyond" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Google Maps API Key", name: "gmapsKey", widget: "string" }
          - { label: "OpenWeatherMap API Key", name: "weatherKey", widget: "string" }
          - { label: "Amazon Associates Tag", name: "amazonTag", widget: "string", required: false, hint: "Your Amazon.ae tracking ID (e.g. sahraandbeyon-21). Applied to every Amazon link on the site." }
          - { label: "Affiliate Disclosure", name: "affiliateDisclosure", widget: "text", required: false, hint: "Shown in the footer. Required for Amazon/affiliate compliance." }
          - { label: "Hero Eyebrow (optional)", name: "heroEyebrow", widget: "string", required: false, hint: "Small label above the homepage title. Leave blank to keep the default." }
          - { label: "Hero Title (optional)", name: "heroTitle", widget: "string", required: false, hint: "Main homepage headline. Leave blank to keep the default styled title." }
          - label: "Social Profiles"
            name: "social"
            widget: "object"
            hint: "Links used by the footer social icons. Leave a field blank to hide that icon."
            fields:
              - { label: "Instagram URL", name: "instagram", widget: "string", required: false, default: "https://instagram.com/sahraandbeyond.ae" }
              - { label: "TikTok URL", name: "tiktok", widget: "string", required: false, default: "https://tiktok.com/@sahraandbeyond.ae" }
              - { label: "YouTube URL", name: "youtube", widget: "string", required: false, default: "https://youtube.com/@sahraandbeyond.ae" }
          - label: "Monetization (fill in when ready)"
            name: "monetization"
            widget: "object"
            hint: "Each booking/tours/newsletter block on the site only appears once you paste a value here. Leave blank to keep it hidden."
            fields:
              - { label: "Tours/Activities link template", name: "toursUrlTemplate", widget: "string", required: false, hint: "Your affiliate search URL with {query} where the place name goes. e.g. https://www.getyourguide.com/s/?q={query}&partner_id=YOURID" }
              - { label: "Hotel/Booking link template", name: "bookingUrlTemplate", widget: "string", required: false, hint: "e.g. https://www.booking.com/searchresults.html?ss={query}&aid=YOURID" }
              - { label: "Newsletter form endpoint", name: "newsletterAction", widget: "string", required: false, hint: "The form POST URL from your email provider (Mailchimp/Buttondown/etc.). When set, the email sign-up box appears." }
              - { label: "Newsletter blurb", name: "newsletterBlurb", widget: "text", required: false, hint: "Short line shown above the email sign-up box." }

  - name: "packing"
    label: "Packing List"
    files:
      - label: "Packing List Items"
        name: "items"
        file: "content/packing.json"
        description: "Master packing list. Items appear in the Trip planner, grouped by heading and filtered to the trip's adventure type."
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            label_singular: "Item"
            summary: "{{fields.name}}  ·  {{fields.group}}"
            fields:
              - { label: "Group heading", name: "group", widget: "string", hint: "Items with the same heading are grouped together, e.g. '💧 Water & Hydration'." }
              - { label: "Item name", name: "name", widget: "string" }
              - { label: "Quantity", name: "qty", widget: "string", required: false, hint: "Optional. Tokens: {p} = group size, {half} = half the group, {water} = 4L × group. e.g. ×{p}  or  {water}L total" }
              - { label: "Note", name: "note", widget: "string", required: false, hint: "Small grey sub-text under the item (e.g. a free app name)." }
              - { label: "Amazon search term", name: "query", widget: "string", required: false, hint: "What the Amazon button searches for, e.g. 'sand recovery boards'. Leave blank (and no product link) for no button." }
              - { label: "Amazon product link (optional)", name: "amazon", widget: "string", required: false, hint: "Paste a specific Amazon.ae product URL (e.g. https://www.amazon.ae/dp/B0XXXXXXX) to link straight to that product instead of a search. Your affiliate tag is added automatically. Overrides the search term above." }
              - label: "Show only for"
                name: "show"
                widget: "select"
                multiple: true
                required: false
                options: ["Overnight", "Dunes", "Wadis", "Coast", "Mountains", "Camping"]
                hint: "Leave empty to always show. 'Overnight' shows on overnight trips; an adventure type shows only for that destination category."
